<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>電卓</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="calculator">
    <div class="display">
      <div class="display-sub" id="display-sub"></div>
      <div class="display-main" id="display-main">0</div>
    </div>
    <div class="buttons">
      <button id="btn-clear" class="btn btn-clear">C</button>
      <button id="btn-delete" class="btn btn-op">←</button>
      <button id="btn-percent" class="btn btn-op">%</button>
      <button id="btn-divide" class="btn btn-op">÷</button>

      <button id="btn-7" class="btn btn-number">7</button>
      <button id="btn-8" class="btn btn-number">8</button>
      <button id="btn-9" class="btn btn-number">9</button>
      <button id="btn-multiply" class="btn btn-op">×</button>

      <button id="btn-4" class="btn btn-number">4</button>
      <button id="btn-5" class="btn btn-number">5</button>
      <button id="btn-6" class="btn btn-number">6</button>
      <button id="btn-subtract" class="btn btn-op">−</button>

      <button id="btn-1" class="btn btn-number">1</button>
      <button id="btn-2" class="btn btn-number">2</button>
      <button id="btn-3" class="btn btn-number">3</button>
      <button id="btn-add" class="btn btn-op">＋</button>

      <button id="btn-0" class="btn btn-number btn-zero">0</button>
      <button id="btn-dot" class="btn btn-number">.</button>
      <button id="btn-equal" class="btn btn-equal">=</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
